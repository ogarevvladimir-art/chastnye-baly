<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Частные балы — сайт</title>
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:var(--surface-page)}a{color:var(--color-accent);text-decoration:none}a:hover{color:var(--color-accent-hover)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Process.jsx"></script>
<script type="text/babel" src="Evenings.jsx"></script>
<script type="text/babel" src="Contact.jsx"></script>
<script type="text/babel">
const NAV = ['Как это происходит', 'Вечера', 'О нас', 'Связаться'];
const PHONE = '+7 495 000-00-00';

function Site() {
  const [screen, setScreen] = React.useState('Главная');
  const go = (item) => { setScreen(item); window.scrollTo(0, 0); };
  const active = screen === 'Главная' ? undefined : screen;
  return (
    <PageShell nav={NAV} active={active} phone={PHONE} onNavigate={go} headerSurface={screen === 'Главная' ? 'brand' : 'ink'}>
      {screen === 'Главная' && <HomeScreen onNavigate={go} />}
      {screen === 'Как это происходит' && <ProcessScreen onNavigate={go} />}
      {screen === 'Вечера' && <EveningsScreen onNavigate={go} />}
      {screen === 'Связаться' && <ContactScreen />}
      {screen === 'О нас' && (
        <Section style={{ paddingTop: 96, minHeight: 420 }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 34, maxWidth: 720 }}>
            <div style={{ fontSize: 13, fontWeight: 500, letterSpacing: '2.34px', color: 'var(--color-accent)' }}>04 — О НАС</div>
            <div style={{ fontFamily: 'var(--micro-family)', fontStyle: 'italic', fontSize: 'var(--micro-size)', letterSpacing: 'var(--micro-tracking)', lineHeight: 1, color: 'var(--greige-90)' }}>страница намеренно оставлена пустой</div>
            <p style={{ margin: 0, fontFamily: 'var(--text-family)', fontSize: 'var(--text-size)', fontWeight: 600, lineHeight: 1.7, letterSpacing: 'var(--text-tracking)', textTransform: 'uppercase', color: 'var(--text-body)' }}>В исходных материалах нет ни текста, ни изображений для этого раздела. Раскладка появится, когда придёт контент — придумывать его за бренд система не должна.</p>
          </div>
        </Section>
      )}
    </PageShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site />);
</script></body></html>
