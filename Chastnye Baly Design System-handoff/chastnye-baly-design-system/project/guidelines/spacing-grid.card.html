<!-- @dsCard group="Spacing" viewport="700x150" name="Колоночная сетка" subtitle="12 колонок, gap 24px; рабочие раскладки 6+6, 4+4+4, 3+9, 12" -->
<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--greige-90);font-family:var(--font-sans);width:700px;height:150px;box-sizing:border-box;padding:18px 20px;overflow:hidden}
.lbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--greige-90)}
.val{font-size:11px;font-weight:500;letter-spacing:.5px;color:var(--greige-50)}
.note{font-size:10px;font-weight:500;letter-spacing:.3px;color:var(--text-muted);line-height:1.5}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:76px;border-radius:var(--radius)}
.row{display:grid;gap:14px}
a{color:var(--color-accent);text-decoration:none}a:hover{color:var(--color-accent-hover)}
</style></head><body><div style="display:flex;flex-direction:column;gap:12px">
<div style="display:grid;grid-template-columns:repeat(12,1fr);gap:24px;height:66px"><div style="background:rgba(201,106,66,.22);border-top:1px solid var(--color-accent)"></div><div style="background:rgba(201,106,66,.22);border-top:1px solid var(--color-accent)"></div><div style="background:rgba(201,106,66,.22);border-top:1px solid var(--color-accent)"></div><div style="background:rgba(201,106,66,.22);border-top:1px solid var(--color-accent)"></div><div style="background:rgba(201,106,66,.22);border-top:1px solid var(--color-accent)"></div><div style="background:rgba(201,106,66,.22);border-top:1px solid var(--color-accent)"></div><div style="background:rgba(201,106,66,.22);border-top:1px solid var(--color-accent)"></div><div style="background:rgba(201,106,66,.22);border-top:1px solid var(--color-accent)"></div><div style="background:rgba(201,106,66,.22);border-top:1px solid var(--color-accent)"></div><div style="background:rgba(201,106,66,.22);border-top:1px solid var(--color-accent)"></div><div style="background:rgba(201,106,66,.22);border-top:1px solid var(--color-accent)"></div><div style="background:rgba(201,106,66,.22);border-top:1px solid var(--color-accent)"></div></div>
<div class="note">6+6 — сегментация · 4+4+4 — шаги · 3+9 — текст с боковой меткой · 12 — крупный заголовок во всю ширину.</div>
</div></body></html>
