<!-- @dsCard group="Colors" viewport="700x165" name="Шкала прозрачности" subtitle="Иерархия текста строится прозрачностью greige, а не оттенками" -->
<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--greige-90);font-family:var(--font-sans);width:700px;height:165px;box-sizing:border-box;padding:18px 20px;overflow:hidden}
.lbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--greige-90)}
.val{font-size:11px;font-weight:500;letter-spacing:.5px;color:var(--greige-50)}
.note{font-size:10px;font-weight:500;letter-spacing:.3px;color:var(--text-muted);line-height:1.5}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:76px;border-radius:var(--radius)}
.row{display:grid;gap:14px}
a{color:var(--color-accent);text-decoration:none}a:hover{color:var(--color-accent-hover)}
</style></head><body><div class="row" style="grid-template-columns:repeat(4,1fr)">
<div class="sw"><div style="height:44px;background:var(--greige-90)"></div><div class="lbl">90% · --text-title</div><div class="note">H1, H2, знак бренда</div></div>
<div class="sw"><div style="height:44px;background:var(--greige-80)"></div><div class="lbl">80% · --text-subtitle</div><div class="note">H3, название карточки</div></div>
<div class="sw"><div style="height:44px;background:var(--greige-50)"></div><div class="lbl">50% · --text-body</div><div class="note">Основной текст, навигация</div></div>
<div class="sw"><div style="height:44px;background:var(--greige-35)"></div><div class="lbl">35% · --text-muted</div><div class="note">Подписи, служебное</div></div>
</div></body></html>
