<!-- @dsCard group="Colors" viewport="700x190" name="Текст и акцент" subtitle="Greige — единственный цвет текста, терракота — единственный акцент" -->
<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--greige-90);font-family:var(--font-sans);width:700px;height:190px;box-sizing:border-box;padding:18px 20px;overflow:hidden}
.lbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--greige-90)}
.val{font-size:11px;font-weight:500;letter-spacing:.5px;color:var(--greige-50)}
.note{font-size:10px;font-weight:500;letter-spacing:.3px;color:var(--text-muted);line-height:1.5}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:76px;border-radius:var(--radius)}
.row{display:grid;gap:14px}
a{color:var(--color-accent);text-decoration:none}a:hover{color:var(--color-accent-hover)}
</style></head><body><div class="row" style="grid-template-columns:repeat(3,1fr)">
<div class="sw"><div class="chip" style="background:var(--color-greige);"></div><div class="lbl">Greige</div><div class="val">#aba79a · --color-greige</div><div class="note">Весь текст. Иерархию задаёт прозрачность</div></div>
<div class="sw"><div class="chip" style="background:var(--color-accent);"></div><div class="lbl">Accent</div><div class="val">#c96a42 · --color-accent</div><div class="note">Нумерация, метки секций, ошибка поля</div></div>
<div class="sw"><div class="chip" style="background:var(--color-accent-hover);"></div><div class="lbl">Accent hover</div><div class="val">#e08a5f · --color-accent-hover</div><div class="note">Только hover текстовых ссылок</div></div>
</div></body></html>
