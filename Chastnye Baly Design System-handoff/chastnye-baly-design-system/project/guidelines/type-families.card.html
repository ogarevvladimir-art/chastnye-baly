<!-- @dsCard group="Type" viewport="700x200" name="Гарнитуры" subtitle="Антиква для голоса, гротеск для служебного слоя" -->
<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--greige-90);font-family:var(--font-sans);width:700px;height:200px;box-sizing:border-box;padding:18px 20px;overflow:hidden}
.lbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--greige-90)}
.val{font-size:11px;font-weight:500;letter-spacing:.5px;color:var(--greige-50)}
.note{font-size:10px;font-weight:500;letter-spacing:.3px;color:var(--text-muted);line-height:1.5}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:76px;border-radius:var(--radius)}
.row{display:grid;gap:14px}
a{color:var(--color-accent);text-decoration:none}a:hover{color:var(--color-accent-hover)}
</style></head><body><div class="row" style="grid-template-columns:repeat(2,1fr)">
<div class="sw"><div style="font-family:var(--font-display);font-size:54px;line-height:.9;letter-spacing:-3px;color:var(--text-title)">Аа Бб Вв</div><div class="lbl">Old Standard TT</div><div class="note">Голос бренда: H2, врезки, курсив для интонации. Regular 400 / Italic.</div></div>
<div class="sw"><div style="font-size:54px;font-weight:800;line-height:.9;letter-spacing:-2px;text-transform:uppercase;color:var(--text-title)">Аа Бб Вв</div><div class="lbl">Гротеск · Helvetica Neue</div><div class="note">Служебный слой: H1, H3, навигация, подписи. Всегда капитель. 500 / 600 / 700.</div></div>
</div></body></html>
