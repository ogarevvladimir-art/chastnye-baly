<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--greige-90);font-family:var(--font-sans);width:700px;height:150px;box-sizing:border-box;padding:18px 20px;overflow:hidden}
.lbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--greige-90)}
.val{font-size:11px;font-weight:500;letter-spacing:.5px;color:var(--greige-50)}
.note{font-size:10px;font-weight:500;letter-spacing:.3px;color:var(--text-muted);line-height:1.5}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:76px;border-radius:var(--radius)}
.row{display:grid;gap:14px}
a{color:var(--color-accent);text-decoration:none}a:hover{color:var(--color-accent-hover)}
</style></head><body><div style="display:flex;height:64px">
<div style="flex-grow:3;background:var(--color-terra);display:flex;align-items:flex-end;padding:8px;font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--greige-65)">Hero · Terra</div>
<div style="flex-grow:4;background:var(--color-ink);border-top:1px solid var(--line-row);border-bottom:1px solid var(--line-row);display:flex;align-items:flex-end;padding:8px;font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--greige-50)">Контент · Ink</div>
<div style="flex-grow:2;background:var(--color-ash);display:flex;align-items:flex-end;padding:8px;font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--greige-65)">Передышка · Ash</div>
<div style="flex-grow:4;background:var(--color-ink);border-top:1px solid var(--line-row);border-bottom:1px solid var(--line-row);display:flex;align-items:flex-end;padding:8px;font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--greige-50)">Контент · Ink</div>
<div style="flex-grow:3;background:var(--color-terra);display:flex;align-items:flex-end;padding:8px;font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--greige-65)">Заявка · Terra</div>
</div><div class="note" style="margin-top:12px">Максимум две фоновые заливки на экран. Обрамление, а не украшение.</div></body></html>
