<!-- @dsCard group="Brand" viewport="700x165" name="Обводки и края" subtitle="Скруглений, теней и градиентов в системе нет" -->
<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--greige-90);font-family:var(--font-sans);width:700px;height:165px;box-sizing:border-box;padding:18px 20px;overflow:hidden}
.lbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--greige-90)}
.val{font-size:11px;font-weight:500;letter-spacing:.5px;color:var(--greige-50)}
.note{font-size:10px;font-weight:500;letter-spacing:.3px;color:var(--text-muted);line-height:1.5}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:76px;border-radius:var(--radius)}
.row{display:grid;gap:14px}
a{color:var(--color-accent);text-decoration:none}a:hover{color:var(--color-accent-hover)}
</style></head><body><div class="row" style="grid-template-columns:repeat(3,1fr)">
<div class="sw"><div style="height:56px;border:1px solid var(--border-strong)"></div><div class="lbl">Обводка · 1px greige</div><div class="note">Кнопка, активный брейкпоинт</div></div>
<div class="sw"><div style="height:56px;border:1px solid var(--greige-12)"></div><div class="lbl">Рамка блока · 12%</div><div class="note">Демонстрационная рамка, шапка</div></div>
<div class="sw"><div style="height:56px;background:var(--color-slate)"></div><div class="lbl">Заливка без края</div><div class="note">Карточка: только цвет, radius 0, тени нет</div></div>
</div></body></html>
