<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--greige-90);font-family:var(--font-sans);width:700px;height:190px;box-sizing:border-box;padding:18px 20px;overflow:hidden}
.note{font-size:10px;font-weight:500;letter-spacing:.3px;color:var(--text-muted);line-height:1.5}
.cap{font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted)}
a{color:var(--color-accent);text-decoration:none}a:hover{color:var(--color-accent-hover)}
</style></head><body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
  <div style="display:flex;flex-direction:column;gap:8px"><div style="height:88px;background:var(--color-ink);border:1px solid var(--greige-22);display:flex;align-items:center;justify-content:center"><img src="../assets/logo-plyaskin-events.png" style="height:56px" alt="Plyaskin Events"></div><div class="cap">на Ink</div></div>
  <div style="display:flex;flex-direction:column;gap:8px"><div style="height:88px;background:var(--color-slate);display:flex;align-items:center;justify-content:center"><img src="../assets/logo-plyaskin-events.png" style="height:56px" alt=""></div><div class="cap">на Slate</div></div>
  <div style="display:flex;flex-direction:column;gap:8px"><div style="height:88px;background:var(--color-ash);display:flex;align-items:center;justify-content:center"><img src="../assets/logo-plyaskin-events.png" style="height:56px" alt=""></div><div class="cap">на Ash</div></div>
</div>
<div class="note" style="margin-top:14px">assets/logo-plyaskin-events.png · 1716×738 · прозрачный фон · охра ≈ #806A34. Поверх Terra знак сливается с фоном — там используйте словесный знак «Частные балы». Векторной и монохромной версий нет.</div>
</body></html>
