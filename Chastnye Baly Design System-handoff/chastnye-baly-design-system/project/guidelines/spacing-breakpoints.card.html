<!-- @dsCard group="Spacing" viewport="700x160" name="Брейкпоинты и поля" subtitle="Пять брейкпоинтов из tildastyles, 1200 — базовый" -->
<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--greige-90);font-family:var(--font-sans);width:700px;height:160px;box-sizing:border-box;padding:18px 20px;overflow:hidden}
.lbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--greige-90)}
.val{font-size:11px;font-weight:500;letter-spacing:.5px;color:var(--greige-50)}
.note{font-size:10px;font-weight:500;letter-spacing:.3px;color:var(--text-muted);line-height:1.5}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:76px;border-radius:var(--radius)}
.row{display:grid;gap:14px}
a{color:var(--color-accent);text-decoration:none}a:hover{color:var(--color-accent-hover)}
</style></head><body><div class="row" style="grid-template-columns:repeat(5,1fr)">
<div style="border:1px solid var(--greige-20);padding:16px 14px;display:flex;flex-direction:column;gap:8px"><div style="font-size:24px;font-weight:700;letter-spacing:-.5px;color:var(--greige-90)">320</div><div class="note" style="text-transform:uppercase">Поля 20px · 1 колонка</div></div><div style="border:1px solid var(--greige-20);padding:16px 14px;display:flex;flex-direction:column;gap:8px"><div style="font-size:24px;font-weight:700;letter-spacing:-.5px;color:var(--greige-90)">480</div><div class="note" style="text-transform:uppercase">Поля 24px · 1 колонка</div></div><div style="border:1px solid var(--greige-20);padding:16px 14px;display:flex;flex-direction:column;gap:8px"><div style="font-size:24px;font-weight:700;letter-spacing:-.5px;color:var(--greige-90)">640</div><div class="note" style="text-transform:uppercase">Поля 32px · 2 колонки</div></div><div style="border:1px solid var(--greige-20);padding:16px 14px;display:flex;flex-direction:column;gap:8px"><div style="font-size:24px;font-weight:700;letter-spacing:-.5px;color:var(--greige-90)">960</div><div class="note" style="text-transform:uppercase">Поля 48px · 12 колонок</div></div><div style="border:1px solid var(--border-strong);padding:16px 14px;display:flex;flex-direction:column;gap:8px"><div style="font-size:24px;font-weight:700;letter-spacing:-.5px;color:var(--greige-90)">1200</div><div class="note" style="text-transform:uppercase">Поля 64px · 12 колонок</div></div>
</div></body></html>
