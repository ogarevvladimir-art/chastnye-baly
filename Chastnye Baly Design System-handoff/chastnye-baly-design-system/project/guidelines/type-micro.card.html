<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--greige-90);font-family:var(--font-sans);width:700px;height:155px;box-sizing:border-box;padding:18px 20px;overflow:hidden}
.lbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--greige-90)}
.val{font-size:11px;font-weight:500;letter-spacing:.5px;color:var(--greige-50)}
.note{font-size:10px;font-weight:500;letter-spacing:.3px;color:var(--text-muted);line-height:1.5}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:76px;border-radius:var(--radius)}

<div style="display:flex;gap:18px;align-items:baseline"><div style="font-size:13px;font-weight:500;letter-spacing:2.34px;color:var(--color-accent);width:58px;flex-shrink:0">Micro</div><div class="note" style="text-transform:uppercase">Old Standard TT Italic · 400 · 30px · трекинг −2px · 100%</div></div>
<div style="font-family:var(--font-display);font-style:italic;font-size:30px;line-height:1;letter-spacing:-2px;color:var(--greige-90)">для семьи и близких</div>
<div class="note">Фиксированный кегль на всех брейкпоинтах. Строчными, без точки — это реплика, а не подзаголовок.</div></div></body></html>
